name: Differential fuzz campaign

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      seed:
        description: First deterministic seed
        type: number
        default: 0
        required: true
      count:
        description: Total case budget across the selected matrix
        type: number
        default: 256
        required: true
      domain:
        description: Generated domain
        type: choice
        options: [all, models, dag, ce, bce, sdpa, decoder, moe, delta, vision, dit, sparse_attention, mhc]
        default: all
      timeout:
        description: Complete per-case worker budget in seconds
        type: number
        default: 120
        required: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . onnxruntime
      - name: Run isolated campaign and retain all classified failures
        env:
          FUZZ_SEED: ${{ inputs.seed }}
          FUZZ_COUNT: ${{ inputs.count }}
          FUZZ_DOMAIN: ${{ inputs.domain }}
          CASE_TIMEOUT: ${{ inputs.timeout }}
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          timeout --signal=INT --kill-after=20s 20m \
            python tests/fuzz/campaign.py --seed "$FUZZ_SEED" --count "$FUZZ_COUNT" \
            --domain "$FUZZ_DOMAIN" --output-mode both --shape-mode both \
            --opset 18 --opset 23 --opset 26 --timeout "$CASE_TIMEOUT" \
            --keep-going --report fuzz-artifacts/report.json --failure-dir fuzz-artifacts/cases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-cases-and-replay
          path: fuzz-artifacts/
