name: Performance comparison

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline revision (same host and dependencies)
        default: main
        required: true
        type: string
      max_regression:
        description: Optional fractional regression limit; blank only reports
        default: ''
        required: false
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
          path: baseline
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install shared dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./current onnxruntime
      - name: Measure baseline and current source in isolated workers
        env:
          MAX_REGRESSION: ${{ inputs.max_regression }}
        run: |
          python current/benchmarks/performance.py --source-dir baseline --output baseline.json
          args=()
          if [ -n "$MAX_REGRESSION" ]; then args+=(--max-regression "$MAX_REGRESSION"); fi
          python current/benchmarks/performance.py --source-dir current --baseline baseline.json --output current.json "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-reports
          path: '*.json'
