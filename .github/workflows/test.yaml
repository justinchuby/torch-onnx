name: Test

on:
  push:
    branches:
      - main
      - 'gh/**/base' # ghstack base branches
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      pytest_filter:
        description: "Optional pytest -k expression for manual diagnostics; empty runs the full suite"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  optional-operators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install real optional packages and pinned development schemas
        run: |
          pip install -r requirements-dev.txt -e . torchao==0.18.0 torchvision==0.29.2
          pip install "onnx @ git+https://github.com/onnx/onnx.git@622adf94d4e720142950aa8178f7357d52e63db0"
      - name: Export, check, execute, and serialize optional operators
        run: pytest tests/exporter/test_optional_packages.py -m "integration or not integration"
  opset29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install package and current development schemas
        run: |
          pip install -r requirements-dev.txt -e .
          pip install "onnx @ git+https://github.com/onnx/onnx.git@622adf94d4e720142950aa8178f7357d52e63db0"
      - name: Check and execute development operators using ONNX reference runtime
        run: pytest tests/exporter/test_opsets.py -m opset29
  test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.pytest_filter && 'Targeted Linux diagnostics (not full CI)' || format('test ({0}, {1})', matrix.os, matrix.python-version) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        env:
          PYTEST_FILTER: ${{ inputs.pytest_filter || '' }}
        run: pytest -k "$PYTEST_FILTER" --cov=torch_onnx --cov-report=xml --cov-append --cov-branch --junitxml=junit.xml
      - name: Run FBGEMM reference regressions
        run: pytest tests/recovered/test_quantized_storage_regressions.py -m integration --cov=torch_onnx --cov-report=xml --cov-append --cov-branch --junitxml=junit-fbgemm.xml
      - name: Type check modern exporter and native translations
        run: python -m pyrefly check
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
