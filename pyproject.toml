[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-onnx"
version = "0.2.0"
description = "Convert PyTorch models to ONNX"
authors = [{ name = "Justin Chu", email = "justinchu@microsoft.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT AND BSD-3-Clause"}
keywords = ["onnx", "pytorch", "converter", "convertion", "exporter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "torch>=2.15,<2.16",
  "onnx-ir>=1.1.0",
  "onnx-shape-inference>=0.4.5",
  "onnxscript>=0.7.2",
  "onnx>=1.23.2",
  "typing-extensions",
  "packaging"
]

[project.urls]
Repository = "https://github.com/justinchuby/torch-onnx"

[project.scripts]
torch-onnx = "torch_onnx.bin.convert:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSE-PYTORCH"]

[tool.pytest.ini_options]
pythonpath = ["tests", "tests/torchlib", "tests/models/regressions"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = '--tb=short --color=yes -m "not integration and not opinfo and not opset29"'
testpaths = [
  "tests/exporter",
  "tests/torchlib",
  "tests/conversion_test.py",
  "tests/decomp_test.py",
  "tests/fake_tensor_test.py",
  "tests/standalone_test.py",
  "tests/models/regressions",
]
markers = [
  "integration: optional model-family or backend-specific suites (FBGEMM references run explicitly in CI)",
  "opinfo: expanded PyTorch OpInfo operator coverage",
  "opset29: requires the pinned ONNX main build; separate development-schema CI job",
]

[tool.pyrefly]
project-includes = ["src/torch_onnx"]
# The legacy ONNX Script DSL overrides Value operators and Evaluator returns;
# their upstream base annotations are not substitutable. Runtime tests cover them.
project-excludes = [
  "src/torch_onnx/_building.py",
  "src/torch_onnx/_tensors.py",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "B904", # Re-raised error without specifying the cause via the from keyword
    "E",
    "EXE",
    "F",
    "G",
    "I",
    "LOG",
    "NPY",
    "PERF",
    "PGH004",
    "PIE794",
    "PIE800",
    "PIE804",
    "PIE807",
    "PIE810",
    "PLC",
    "PLE",
    "PLR0133", # constant comparison
    "PLR0206", # property with params
    "PLR1722", # use sys exit
    "PLW",
    "PYI",
    "RSE",
    "RUF",
    "SIM",
    "TRY002",
    "TRY302",
    "TRY401",
    "UP",
    "W",
]

ignore = [
  "E501", # line too long
  "PYI041",
  "NPY002",
  "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"tests/onnx_test_common.py" = ["UP006", "UP007"]
"tests/pytorch_test.py" = ["UP006", "UP007"]
"tests/pytorch_test_common.py" = ["UP006", "UP007"]
# Preserve upstream's explicit control flow and normalization of loop-local values.
"src/torch_onnx/**/*.py" = ["SIM102", "SIM108", "PLW2901", "PERF401"]
# These callbacks are evaluated synchronously inside their loop iteration.
"tests/exporter/test_native*.py" = ["B023", "PERF401"]
"tests/exporter/test_small_models_e2e.py" = ["B023"]
"tests/torchlib/*.py" = ["PLW2901"]
"tests/exporter/test_*regressions.py" = ["PERF401"]
"tests/torchlib/test_*regressions.py" = ["PERF401"]
"tests/models/regressions/*.py" = ["PERF401"]
